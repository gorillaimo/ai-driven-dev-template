      kind: url
      target: https://github.com/gorillaimo/ai-driven-dev-template/issues/47#issuecomment-6623910263
human_owner: gorillaimo
risk: high
allowed_stages:
  - validation
allowed_paths:
  - .ai-workflow
  - .github
  - docs
  - tests
  - tools
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - CHANGELOG.md
  - LICENSE
  - VERSION
  - .gitignore
  - .gitattributes
forbidden_paths: []
required_acs:
  - security-policy
review_required: true
review_omission_reason: ""
max_age_seconds: 86400
stop_severities:
  - critical
  - high
delegates: []
commands:
  - command_id: security-secrets
    executable: gitleaks
    argv:
      - dir
      - --config=/policy/gitleaks.toml
      - --gitleaks-ignore-path=/policy/empty.ignore
      - --ignore-gitleaks-allow
      - --redact=100
      - --exit-code=10
      - --no-banner
      - --report-format=json
      - --report-path=/out/raw.json
      - /src
  - command_id: security-dependencies
    executable: osv-scanner
    argv:
      - scan
      - source
      - --offline
      - --no-resolve
      - --all-packages
      - --no-call-analysis=go
      - --config=/policy/osv-scanner.toml
      - --format=json
      - --output-file=/out/raw.json
      - --lockfile=/src/__targets__
  - command_id: security-static
    executable: semgrep
    argv:
      - scan
      - --config=/policy/semgrep.yaml
      - --metrics=off
      - --disable-version-check
      - --no-trace
      - --no-git-ignore
      - --disable-nosem
      - --json
      - --error
      - --output=/out/raw.json
      - /src/__targets__
  - command_id: security-infrastructure
    executable: trivy
    argv:
      - config
      - --config=/policy/trivy.yaml
      - --skip-check-update
      - --skip-version-check
      - --disable-telemetry
      - --ignorefile=/policy/empty.ignore
      - --exit-code=10
      - --format=json
      - --output=/out/raw.json
      - /src
checks:
  - check_id: secrets
    kind: verification
    domain: template
    acs:
      - security-policy
    command_id: security-secrets
    test_check: false
  - check_id: dependencies
    kind: verification
    domain: template
    acs:
      - security-policy
    command_id: security-dependencies
    test_check: false
  - check_id: static
    kind: verification
    domain: template
    acs:
      - security-policy
    command_id: security-static
    test_check: false
  - check_id: infrastructure
    kind: verification
    domain: template
    acs:
      - security-policy
    command_id: security-infrastructure
    test_check: false
    when:
      fact_id: has_iac
      equals: true
limits:
  max_issues: 1
  max_concurrent_issues: 1
  max_ai_processes: 1
  run_seconds: 1800
  cleanup_seconds: 300
  call_seconds: 300
  max_repairs: 1
  cost:
    status: known
    amount: 30
    unit: github-actions-job-minutes
