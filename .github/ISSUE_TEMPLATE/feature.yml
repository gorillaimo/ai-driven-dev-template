name: 機能追加 / 変更
description: 新機能、仕様変更、実装タスク
title: "[Feature]: "
labels:
  - needs-triage
  - feature
body:
  - type: markdown
    attributes:
      value: |
        このフォームは、人間とAIエージェントの作業契約として扱います。
        不明な項目は空欄にせず「TBD」と記入してください。
  - type: input
    id: app_name
    attributes:
      label: アプリ名
      description: アプリケーションまたはプロダクトの名前。
      placeholder: Example App
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 対象プラットフォーム
      multiple: true
      options:
        - Next.js Web
        - Flutter iOS
        - Flutter Android
        - Flutter Web
        - Backend API
        - Infrastructure
        - Documentation
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: このissueで達成したいこと。
      placeholder: このissueで作りたい成果を書いてください。
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜ今この変更が必要なのか。
      placeholder: ユーザー課題、業務背景、技術的理由など。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: スコープ
      description: このissueで対応すること。
      placeholder: |
        - TBD
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: 非スコープ
      description: このissueでは対応しないこと。
      placeholder: |
        - TBD
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: 対象ユーザー / ロール
      description: 誰がこの機能を使い、どの権限が必要か。
      placeholder: Admin, member, guest, system job など。
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: 主な利用シーン
      description: いつ、どのように使われるか。
      placeholder: ユーザーフローや運用シナリオを書いてください。
    validations:
      required: true
  - type: textarea
    id: io
    attributes:
      label: 入力 / 出力
      description: ユーザー入力、API入力、保存データ、画面表示、APIレスポンス、通知など。
      placeholder: |
        入力:
        出力:
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: データ要件
      description: 保存または参照するデータ。個人情報や機微情報を含む場合は明記する。
      placeholder: TBD
    validations:
      required: true
  - type: textarea
    id: auth
    attributes:
      label: 認証 / 認可
      description: ログイン要否、ロール、権限、アクセス制限。
      placeholder: TBD
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了判定に使えるチェック可能な条件。
      placeholder: |
        - [ ] TBD
        - [ ] TBD
        - [ ] TBD
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: テスト観点
      description: 正常系、異常系、権限、境界値、回帰観点。
      placeholder: |
        - 正常系:
        - 異常系:
        - 権限・認可:
        - 境界値:
        - 回帰:
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: 参照ドキュメント
      description: AIエージェントが読む、または更新する必要がある既存ドキュメント。
      placeholder: |
        - docs/system-context.md
        - docs/requirements/TBD.md
        - docs/design/TBD.md
        - docs/api/openapi.yaml
    validations:
      required: false
  - type: textarea
    id: open_questions
    attributes:
      label: 未決事項
      description: 実装前に確認すべきこと。
      placeholder: |
        - [ ] TBD
    validations:
      required: false
