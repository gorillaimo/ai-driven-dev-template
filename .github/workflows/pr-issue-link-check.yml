name: PR Issue Link Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const hasIssueLink = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body);
            const hasVerification = body.includes("実行した検証");

            const problems = [];
            if (!hasIssueLink) {
              problems.push("対応issueを `Closes #123` の形式で記載してください。");
            }
            if (!hasVerification) {
              problems.push("PRテンプレートの `実行した検証` を残してください。");
            }

            if (problems.length === 0) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                "PR本文に不足があります。",
                "",
                ...problems.map((problem) => `- ${problem}`),
                "",
                "issueベース開発の追跡性を保つため、本文を更新してください。"
              ].join("\n")
            });

            core.setFailed("PR body is missing required issue-based development fields.");
